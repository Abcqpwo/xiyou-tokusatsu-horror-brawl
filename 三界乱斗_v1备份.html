   三界 · 乱斗 —— 西游 / 特摄 / 日漫 / 怪谈 四界融合大乱斗
   ============================================================ */

const W = 1400, H = 820, TAU = Math.PI * 2;
const cv = document.getElementById('cv');
const ctx = cv.getContext('2d');
const ui = document.getElementById('ui');

const clamp = (v, a, b) => v < a ? a : (v > b ? b : v);
const rand = (a, b) => a + Math.random() * (b - a);
const randi = (a, b) => Math.floor(a + Math.random() * (b - a + 1));
const pick = a => a[Math.floor(Math.random() * a.length)];
const he = (hex, a) => {
  const h = hex.slice(1);
  return 'rgba(' + parseInt(h.slice(0, 2), 16) + ',' + parseInt(h.slice(2, 4), 16) + ',' + parseInt(h.slice(4, 6), 16) + ',' + a + ')';
};
function angDiff(a, b) {
  let d = (a - b) % TAU;
  if (d > Math.PI) d -= TAU;
  if (d < -Math.PI) d += TAU;
  return d;
}
function rr(x, y, w, h, r) {
  r = Math.min(r, w / 2, h / 2);
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.arcTo(x + w, y, x + w, y + h, r);
  ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r);
  ctx.arcTo(x, y, x + w, y, r);
  ctx.closePath();
}
function txt(str, x, y, size, color, align, weight) {
  ctx.font = (weight || 'bold') + ' ' + size + 'px "PingFang SC","Microsoft YaHei",sans-serif';
  ctx.fillStyle = color;
  ctx.textAlign = align || 'left';
  ctx.textBaseline = 'middle';
  ctx.fillText(str, x, y);
}
function glow(x, y, r, color, alpha) {
  const g = ctx.createRadialGradient(x, y, 0, x, y, Math.max(1, r));
  g.addColorStop(0, he(color, alpha));
  g.addColorStop(1, he(color, 0));
  ctx.fillStyle = g;
  ctx.beginPath();
  ctx.arc(x, y, Math.max(1, r), 0, TAU);
  ctx.fill();
}

/* ------------------------ 音效 ------------------------ */
let AC = null;
const sfxLast = {};
function sfx(name) {
  const now = performance.now();
  if (sfxLast[name] && now - sfxLast[name] < 45) return;
  sfxLast[name] = now;
  try {
    if (!AC) AC = new (window.AudioContext || window.webkitAudioContext)();
    const t = AC.currentTime;
    const o = AC.createOscillator(), g = AC.createGain();
    o.connect(g); g.connect(AC.destination);
    let f = 440, dur = 0.1, type = 'square', vol = 0.05;
    if (name === 'hit') { f = 190; dur = 0.06; type = 'square'; vol = 0.04; }
    else if (name === 'melee') { f = 280; dur = 0.14; type = 'sawtooth'; vol = 0.055; }
    else if (name === 'shoot') { f = 780; dur = 0.08; type = 'triangle'; vol = 0.05; }
    else if (name === 'hurt') { f = 120; dur = 0.22; type = 'square'; vol = 0.09; }
    else if (name === 'kill') { f = 560; dur = 0.11; type = 'triangle'; vol = 0.06; }
    else if (name === 'ult') { f = 920; dur = 0.5; type = 'sawtooth'; vol = 0.08; }
    else if (name === 'pick') { f = 880; dur = 0.13; type = 'sine'; vol = 0.07; }
    else if (name === 'die') { f = 220; dur = 0.7; type = 'sawtooth'; vol = 0.1; }
    else if (name === 'boss') { f = 90; dur = 0.6; type = 'sawtooth'; vol = 0.09; }
    o.type = type;
    o.frequency.setValueAtTime(f, t);
    if (name === 'shoot') o.frequency.exponentialRampToValueAtTime(f * 0.5, t + dur);
    if (name === 'ult') o.frequency.exponentialRampToValueAtTime(150, t + dur);
    if (name === 'die' || name === 'boss') o.frequency.exponentialRampToValueAtTime(55, t + dur);
    g.gain.setValueAtTime(vol, t);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.start(t); o.stop(t + dur + 0.03);
  } catch (e) { /* 静音失败不影响游戏 */ }
}

  mode: 'menu', act: 0, stage: 0, time: 0, score: 0, combo: 0, comboT: 0,

};

const mouse = { x: W / 2, y: H / 2 - 120, down: false };
const keys = {};

/* ------------------------ 输入 ------------------------ */
window.addEventListener('keydown', e => {
  const k = e.key.toLowerCase();
  if ([' ', 'arrowup', 'arrowdown', 'arrowleft', 'arrowright'].indexOf(k) >= 0) e.preventDefault();
  keys[k] = true;
  if (S.mode === 'play') {
    if (k === ' ') doDash();
    if (k === 'e') castUlt();
    if (k === 'r') doTransform();
    if (k >= '1' && k <= '4') setBlood(parseInt(k) - 1);
    if (k === 'j') doAttack();
    if (k === 'p') pauseGame();
  } else if (S.mode === 'pause' && k === 'p') {
    resumeGame();
  }
});
window.addEventListener('keyup', e => { keys[e.key.toLowerCase()] = false; });
window.addEventListener('blur', () => { for (const k in keys) keys[k] = false; mouse.down = false; });

cv.addEventListener('mousemove', e => {
  const r = cv.getBoundingClientRect();
  mouse.x = clamp((e.clientX - r.left) * (W / r.width), 0, W);
  mouse.y = clamp((e.clientY - r.top) * (H / r.height), 0, H);
});
cv.addEventListener('mousedown', e => {
  if (e.button !== 0) return;
  mouse.down = true;
  doAttack();
  if (AC && AC.state === 'suspended') AC.resume();
});
window.addEventListener('mouseup', e => { if (e.button === 0) mouse.down = false; });
cv.addEventListener('contextmenu', e => e.preventDefault());

function resize() {
  const s = Math.min(window.innerWidth / W, window.innerHeight / H) * 0.985;
  cv.style.width = (W * s) + 'px';
  cv.style.height = (H * s) + 'px';
}
window.addEventListener('resize', resize);

/* ------------------------ 玩家 ------------------------ */
function makePlayer() {

    atkBoostT: 0, ultDash: 0, ultHit: null,
    trail: [], hitFlash: 0,
    mods: {
      range: 1, meleeDmg: 1, beamSpd: 1, darkRange: 1, speed: 1,
      pierce: 0, rageGain: 1, dashCd: 1, ultPower: 1,
      transformDur: 1, transformCd: 1, dmgAll: 1, armor: 0,
      lifesteal: 0, swapInvuln: 0, healOnSwap: 0, dashAtk: 0, pickupChance: 0
    }
  };
}

function setBlood(i) {
  const p = S.player;
  if (!p || i === p.blood || p.swapCd > 0) return;
  p.blood = i;
  p.swapCd = 0.4;
  if (p.mods.swapInvuln > 0) {
    p.iframe = Math.max(p.iframe, p.mods.swapInvuln);
    burstParticles(p.x, p.y, BLOOD[i].color, 12);
  }
  if (p.mods.healOnSwap > 0) heal(p, p.mods.healOnSwap);
  sfx('pick');
}

function heal(p, amt) {
  p.hp = Math.min(p.maxHp, p.hp + amt);
  addText(p.x, p.y - 34, '+' + Math.round(amt), '#8dffab', 15);
}

function addRage(amt) {
  const p = S.player;
  p.rage = Math.min(p.maxRage, p.rage + amt * p.mods.rageGain);
}

function doAttack() {
  if (S.mode !== 'play') return;
  const p = S.player;
  if (!p || p.atkCd > 0) return;
  const tf = p.transformTime > 0;
  const b = tf ? 1 : p.blood;
  const lv = p.bl[b];
  const mul = p.mods.dmgAll;
  p.facing = Math.atan2(mouse.y - p.y, mouse.x - p.x);
  let cd = 0.42;
  if (b === 1) cd = tf ? 0.1 : 0.2;
  else if (b === 2) cd = 0.46;
  else if (b === 3) cd = 0.62;
  if (p.atkBoostT > 0) cd *= 0.6;
  p.atkCd = cd;

  if (b === 0) {
    const R = (94 + 9 * lv) * p.mods.range;
    const dmg = 24 * (1 + 0.17 * (lv - 1)) * p.mods.meleeDmg * mul * (tf ? 1.5 : 1);
    p.swingT = 0.24;
    p.swingAng = p.facing;
    arcDamage(p.x, p.y, R, p.facing, Math.PI * 0.66, dmg, 150);
    sfx('melee');
    S.shake = Math.max(S.shake, 3.5);
    for (let i = 0; i < 6; i++) {
      const a = p.facing + rand(-0.5, 0.5);
      burstOne(p.x + Math.cos(a) * R * 0.75, p.y + Math.sin(a) * R * 0.75, '#ffd88a');
    }
  } else if (b === 1) {
    const spd = 760 * p.mods.beamSpd;
    const dmg = (tf ? 15 : 13) * (1 + 0.17 * (lv - 1)) * mul;
    S.pbul.push({
      x: p.x + Math.cos(p.facing) * 22, y: p.y + Math.sin(p.facing) * 22,
      vx: Math.cos(p.facing) * spd, vy: Math.sin(p.facing) * spd,
      r: tf ? 9 : 7, dmg: dmg, pierce: 1 + p.mods.pierce + (lv - 1),
      life: 1.1, color: tf ? '#fff2b8' : '#58e2ff', hits: [], kind: 'beam'
    });
    sfx('shoot');
  } else if (b === 2) {
    const dmg = 8.5 * (1 + 0.17 * (lv - 1)) * mul;
    for (let i = -1; i <= 1; i++) {
      const a = p.facing + i * 0.2;
      S.pbul.push({
        x: p.x + Math.cos(a) * 18, y: p.y + Math.sin(a) * 18,
        vx: Math.cos(a) * 640, vy: Math.sin(a) * 640,
        r: 6, dmg: dmg, pierce: 1 + p.mods.pierce, life: 0.75,
        color: '#ff6b7d', hits: [], kind: 'shuriken', spin: 0
      });
    }
    sfx('shoot');
  } else {
    const R = 112 * p.mods.darkRange;
    const dmg = 21 * (1 + 0.17 * (lv - 1)) * mul;
    S.rings.push({ x: p.x, y: p.y, r: 16, max: R, dmg: dmg, hits: [], color: '#b47bff', slow: 1.6, done: false, life: 0 });
    sfx('melee');
  }
}

function doDash() {
  const p = S.player;
  if (!p || p.dashCd > 0) return;
  let mx = 0, my = 0;
  if (keys['w'] || keys['arrowup']) my -= 1;
  if (keys['s'] || keys['arrowdown']) my += 1;
  if (keys['a'] || keys['arrowleft']) mx -= 1;
  if (keys['d'] || keys['arrowright']) mx += 1;
  if (!mx && !my) { mx = Math.cos(p.facing); my = Math.sin(p.facing); }
  const len = Math.hypot(mx, my) || 1;
  p.dvx = mx / len * 980;
  p.dvy = my / len * 980;
  p.dashTime = 0.19;
  p.iframe = Math.max(p.iframe, 0.4);
  p.dashCd = 1.15 * p.mods.dashCd;
  if (p.mods.dashAtk > 0) p.atkBoostT = p.mods.dashAtk;
  sfx('shoot');
  S.shake = Math.max(S.shake, 2);
}

function doTransform() {
  const p = S.player;
  if (!p || p.transformCd > 0 || p.transformTime > 0) return;
  p.transformTime = 6.5 * p.mods.transformDur;
  p.transformCd = 24 * p.mods.transformCd;
  p.iframe = Math.max(p.iframe, 1.1);
  burstParticles(p.x, p.y, '#ffe9a8', 40);
  S.effects.push({ type: 'transform', x: p.x, y: p.y, t: 0, dur: 0.6 });
  S.shake = 14;
  sfx('ult');
}

function castUlt() {
  const p = S.player;
  if (!p || p.rage < 100) return;
  p.rage = 0;
  const b = p.blood, lv = p.bl[b];
  const pow = p.mods.ultPower * (1 + 0.08 * lv) * p.mods.dmgAll;
  p.facing = Math.atan2(mouse.y - p.y, mouse.x - p.x);
  p.iframe = Math.max(p.iframe, 0.5);
  if (b === 0) {
    const R = 330 * p.mods.range;
    arcDamage(p.x, p.y, R, p.facing, Math.PI * 1.5, 100 * pow, 340);
    S.effects.push({ type: 'nova', x: p.x, y: p.y, r0: 40, r1: R, color: '#ffc257', t: 0, dur: 0.5 });
    S.shake = 20;
  } else if (b === 1) {
    beamDamage(p.x, p.y, p.facing, 2200, 56, 78 * pow);
    S.effects.push({ type: 'beam', x: p.x, y: p.y, a: p.facing, len: 2200, w: 110, color: '#58e2ff', t: 0, dur: 0.42 });
    S.shake = 16;
  } else if (b === 2) {
    p.dashTime = 0.42;
    p.iframe = Math.max(p.iframe, 0.55);
    p.dvx = Math.cos(p.facing) * 1500;
    p.dvy = Math.sin(p.facing) * 1500;
    p.ultDash = 0.44;
    p.ultHit = [];
    S.effects.push({ type: 'flame', x: p.x, y: p.y, t: 0, dur: 0.6, color: '#ff5569' });
    S.shake = 10;
  } else {
    const vx = clamp(mouse.x, 120, W - 120), vy = clamp(mouse.y, 120, H - 120);
    S.effects.push({ type: 'void', x: vx, y: vy, r: 175, t: 0, dur: 2.6, tick: 0, pow: pow, color: '#b47bff' });
    S.shake = 12;
  }
  sfx('ult');
}

function arcDamage(x, y, R, ang, arc, dmg, knock) {
  for (const e of S.enemies) {
    if (e.dead) continue;
    const dx = e.x - x, dy = e.y - y, d = Math.hypot(dx, dy);
    if (d > R + e.r) continue;
    if (d > e.r && Math.abs(angDiff(Math.atan2(dy, dx), ang)) > arc / 2) continue;
    dealDamage(e, dmg);
    if (knock && d > 1) { e.kx += dx / d * knock; e.ky += dy / d * knock; }
  }
  const bs = S.boss;
  if (bs && !bs.dead) {
    const dx = bs.x - x, dy = bs.y - y, d = Math.hypot(dx, dy);
    if (d < R + bs.r) {
      if (d < bs.r || Math.abs(angDiff(Math.atan2(dy, dx), ang)) <= arc / 2) dealDamage(bs, dmg);
    }
  }
}

function beamDamage(x, y, ang, len, wid, dmg) {
  const cx = Math.cos(ang), cy = Math.sin(ang);
  const hitOne = t => {
    const dx = t.x - x, dy = t.y - y;
    const proj = dx * cx + dy * cy;
    if (proj < 0 || proj > len) return false;
    const perp = Math.abs(-dx * cy + dy * cx);
    return perp < wid / 2 + t.r;
  };
  for (const e of S.enemies) if (!e.dead && hitOne(e)) dealDamage(e, dmg);
  if (S.boss && !S.boss.dead && hitOne(S.boss)) dealDamage(S.boss, dmg);
}

function dealDamage(t, dmg, crit) {
  if (!t || t.dead || t.hp === undefined || t.hp <= 0) return;
  dmg *= S.player.mods.dmgAll;
  t.flash = 0.16;
  if (t.forbidden && !t.isBoss) {
    t.hp = Math.min(t.maxHp, t.hp + dmg * 2);
    addText(t.x, t.y - 34, '增殖', '#e9e9ff', 16);
    if (S.enemies.filter(e => e.forbidden).length < 6) {
      for (let i = 0; i < 2; i++) spawnEnemyAt('ghost', t.x + rand(-50, 50), t.y + rand(-50, 50));
    }
    return;
  }
  t.hp -= dmg;
  const p = S.player;
  if (p.mods.lifesteal > 0) heal(p, dmg * p.mods.lifesteal);
  if (t.isBoss) {
    addText(t.x + rand(-16, 16), t.y - 40, String(Math.round(dmg)), crit ? '#ffd93d' : '#ffffff', 15);
    if (t.hp <= 0) bossDie();
  } else {
    addText(t.x + rand(-8, 8), t.y - t.r - 8, String(Math.round(dmg)), '#ffffff', 14);
    if (t.hp <= 0) killEnemy(t);
  }
  sfx('hit');
}

function killEnemy(e) {
  if (e.dead) return;
  e.dead = true;
  const i = S.enemies.indexOf(e);
  if (i >= 0) S.enemies.splice(i, 1);
  burstParticles(e.x, e.y, e.color, 14);
  const p = S.player;
  S.kills++;
  S.combo++;
  if (S.combo > S.bestCombo) S.bestCombo = S.combo;
  S.comboT = 2.8;
  S.score += Math.round(e.sv * (1 + S.combo * 0.08));
  addRage(6);
  if (Math.random() < 0.15 + p.mods.pickupChance) {
    S.pickups.push({ x: e.x, y: e.y, t: 0, kind: Math.random() < 0.62 ? 'hp' : 'rage', vx: rand(-60, 60), vy: rand(-60, 60) });
  }
  sfx('kill');
}

function hurtPlayer(a) {
  const p = S.player;
  if (!p || S.mode !== 'play' || p.iframe > 0) return;
  drainHp(a, true);
}

function drainHp(a, resetCombo) {
  const p = S.player;
  a *= (1 - p.mods.armor);
  p.hp -= a;
  p.iframe = Math.max(p.iframe, 0.55);
  p.hitFlash = 0.25;
  S.hitFlash = Math.max(S.hitFlash, 0.5);
  S.shake = Math.max(S.shake, 7);
  if (resetCombo) { S.combo = 0; S.comboT = 0; }
  addText(p.x, p.y - 40, '-' + Math.round(a), '#ff7d8c', 16);
  sfx('hurt');
  if (p.hp <= 0) gameOver();
}

/* ------------------------ 敌人 ------------------------ */
function spawnEnemyAt(type, x, y) {
  const t = ET[type];
  if (!t) return null;
  const scale = 1 + 0.28 * S.act;
  const e = {
    uid: S.uid++, type: type, name: t.name, x: x, y: y, r: t.r,
    hp: t.hp * scale, maxHp: t.hp * scale, spd: t.spd, dmg: t.dmg,
    color: t.color, sides: t.sides, ai: t.ai,
    sv: t.sv || 12, forbidden: !!t.forbidden,
    kx: 0, ky: 0, flash: 0, t: rand(0, 3), touchCd: 0,
    st: rand(0, 1.4), fireT: rand(0.6, 2.2), blinkT: rand(1.2, 2.4),
    slowT: 0, ang: rand(0, TAU), dead: false, wob: rand(0, TAU),
    ghostLife: t.forbidden ? rand(11, 16) : 0,
    rate: t.rate || 2, bs: t.bs || 280
  };
  S.enemies.push(e);
  burstParticles(x, y, t.color, 8);
  return e;
}

function spawnEnemy(type) {
  const t = ET[type];
  if (!t) return;
  let x = W / 2, y = H / 2, tries = 0;
  do {
    const edge = randi(0, 3);
    if (edge === 0) { x = rand(80, W - 80); y = 70; }
    else if (edge === 1) { x = rand(80, W - 80); y = H - 70; }
    else if (edge === 2) { x = 70; y = rand(80, H - 80); }
    else { x = W - 70; y = rand(80, H - 80); }
    tries++;
  } while (S.player && Math.hypot(x - S.player.x, y - S.player.y) < 240 && tries < 12);
  spawnEnemyAt(type, x, y);
}

function updateEnemies(dt) {
  const p = S.player;
  for (let i = S.enemies.length - 1; i >= 0; i--) {
    const e = S.enemies[i];
    e.t += dt;
    e.flash = Math.max(0, e.flash - dt);
    e.touchCd = Math.max(0, e.touchCd - dt);
    if (e.slowT > 0) e.slowT -= dt;
    if (e.ghostLife > 0) {
      e.ghostLife -= dt;
      if (e.ghostLife <= 0) {
        burstParticles(e.x, e.y, '#e9e9ff', 12);
        e.dead = true;
        S.enemies.splice(i, 1);
        continue;
      }
    }
    const spdMul = e.slowT > 0 ? 0.4 : 1;
    const dx = p.x - e.x, dy = p.y - e.y;
    const d = Math.hypot(dx, dy) || 1;
    const ux = dx / d, uy = dy / d;

    if (e.ai === 'chase') {
      e.x += ux * e.spd * spdMul * dt;
      e.y += uy * e.spd * spdMul * dt;
      contact(e);
    } else if (e.ai === 'charger') {
      e.st -= dt;
      if (e.st > 0) {
        e.x += ux * e.spd * 0.35 * spdMul * dt;
        e.y += uy * e.spd * 0.35 * spdMul * dt;
      } else {
        if (e.st > -0.75) {
          e.x += ux * e.spd * 2.9 * spdMul * dt;
          e.y += uy * e.spd * 2.9 * spdMul * dt;
        } else {
          e.st = rand(0.9, 1.6);
        }
      }
      contact(e);
    } else if (e.ai === 'shooter') {
      if (d > 330) { e.x += ux * e.spd * dt; e.y += uy * e.spd * dt; }
      else if (d < 210) { e.x -= ux * e.spd * 0.8 * dt; e.y -= uy * e.spd * 0.8 * dt; }
      else { e.x += -uy * e.spd * 0.7 * dt; e.y += ux * e.spd * 0.7 * dt; }
      e.fireT -= dt;
      if (e.fireT <= 0 && d < 640) {
        e.fireT = e.rate;
        fireAt(e, p.x, p.y, e.bs);
      }
      contact(e);
    } else if (e.ai === 'orbit') {
      const want = 250;
      const radial = (d - want) / want;
      e.ang += dt * 1.2;
      e.x += ux * e.spd * clamp(radial, -1, 1) * dt + Math.cos(e.ang) * 70 * dt;
      e.y += uy * e.spd * clamp(radial, -1, 1) * dt + Math.sin(e.ang) * 70 * dt;
      e.fireT -= dt;
      if (e.fireT <= 0) { e.fireT = e.rate; fireAt(e, p.x, p.y, e.bs); }
      contact(e);
    } else if (e.ai === 'blink') {
      e.blinkT -= dt;
      if (e.blinkT <= 0) {
        e.blinkT = rand(1.8, 2.6);
        const a = rand(0, TAU), r = rand(80, 130);
        burstParticles(e.x, e.y, e.color, 8);
        e.x = clamp(p.x + Math.cos(a) * r, 40, W - 40);
        e.y = clamp(p.y + Math.sin(a) * r, 40, H - 40);
        burstParticles(e.x, e.y, e.color, 8);
      } else {
        e.x += ux * e.spd * 0.55 * spdMul * dt;
        e.y += uy * e.spd * 0.55 * spdMul * dt;
      }
      contact(e);
    } else if (e.ai === 'ghost') {
      e.wob += dt * 1.6;
      e.x += (ux * e.spd + Math.cos(e.wob) * 26) * spdMul * dt;
      e.y += (uy * e.spd + Math.sin(e.wob) * 26) * spdMul * dt;
      contact(e);
    }

    e.x += e.kx * dt;
    e.y += e.ky * dt;
    e.kx *= 0.86;
    e.ky *= 0.86;

    for (let j = i - 1; j >= 0; j--) {
      const o = S.enemies[j];
      const ox = o.x - e.x, oy = o.y - e.y;
      const od = Math.hypot(ox, oy) || 0.001;
      const min = e.r + o.r;
      if (od < min) {
        const push = (min - od) / 2;
        e.x -= ox / od * push; e.y -= oy / od * push;
        o.x += ox / od * push; o.y += oy / od * push;
      }
    }

    e.x = clamp(e.x, 24, W - 24);
    e.y = clamp(e.y, 24, H - 24);
  }

  for (let i = S.pickups.length - 1; i >= 0; i--) {
    const it = S.pickups[i];
    it.t += dt;
    it.x += it.vx * dt; it.y += it.vy * dt;
    it.vx *= 0.9; it.vy *= 0.9;
    const dd = Math.hypot(p.x - it.x, p.y - it.y) || 1;
    if (dd < 150) {
      const s = 260 * (1 - dd / 150) + 60;
      it.x += (p.x - it.x) / dd * s * dt;
      it.y += (p.y - it.y) / dd * s * dt;
    }
    if (dd < p.r + 14) {
      if (it.kind === 'hp') { heal(p, 10); }
      else { addRage(22); addText(p.x, p.y - 34, '怒气 +22', '#ffd161', 14); }
      S.pickups.splice(i, 1);
      sfx('pick');
      burstParticles(it.x, it.y, it.kind === 'hp' ? '#8dffab' : '#ffd161', 10);
    }
  }
}

function contact(e) {
  const p = S.player;
  const d = Math.hypot(p.x - e.x, p.y - e.y);
  if (d < p.r + e.r && e.touchCd <= 0 && e.dmg > 0) {
    e.touchCd = 0.75;
    hurtPlayer(e.dmg);
    const a = Math.atan2(p.y - e.y, p.x - e.x);
    e.kx -= Math.cos(a) * 120;
    e.ky -= Math.sin(a) * 120;
  }
}

function fireAt(e, tx, ty, spd) {
  const a = Math.atan2(ty - e.y, tx - e.x);
  S.ebul.push({
    x: e.x + Math.cos(a) * (e.r + 4), y: e.y + Math.sin(a) * (e.r + 4),
    vx: Math.cos(a) * spd, vy: Math.sin(a) * spd,
    r: 7, dmg: 9 + S.act * 2, life: 3.2, color: e.color, src: e.name
  });
  sfx('shoot');
}

/* ------------------------ BOSS ------------------------ */
function spawnBoss() {
  const cfg = ACTS[S.act].boss;
  S.boss = {
    isBoss: true, x: W / 2, y: 170, r: cfg.r,
    hp: cfg.hp, maxHp: cfg.hp, name: cfg.name, color: cfg.color,
    t: 0, ang: 0, flash: 0, burstT: 1.4, aimT: 2.0, dashT: 3.6,
    dashTime: 0, dvx: 0, dvy: 0, phase: 0, cfg: cfg, summonT: 8, dead: false
  };
  S.shake = 12;
  sfx('boss');
}

function updateBoss(dt) {
  const b = S.boss;
  if (!b || b.dead) return;
  const p = S.player;
  const cfg = b.cfg;
  b.t += dt;
  b.ang += dt * 0.9;
  b.flash = Math.max(0, b.flash - dt);
  if (b.phase === 0 && b.hp < b.maxHp * 0.5) {
    b.phase = 1;
    b.burstT = 0.8;
    burstParticles(b.x, b.y, b.color, 40);
    S.shake = 16;
  }
  const speedK = b.phase ? 0.72 : 1;

  if (b.dashTime > 0) {
    b.dashTime -= dt;
    b.x += b.dvx * dt;
    b.y += b.dvy * dt;
  } else {
    const dx = p.x - b.x, dy = p.y - b.y;
    const d = Math.hypot(dx, dy) || 1;
    if (d > 240) { b.x += dx / d * cfg.spd * dt; b.y += dy / d * cfg.spd * dt; }
    else { b.x += -dy / d * cfg.spd * 0.6 * dt; b.y += dx / d * cfg.spd * 0.6 * dt; }
  }
  b.x = clamp(b.x, b.r + 20, W - b.r - 20);
  b.y = clamp(b.y, b.r + 20, H - b.r - 20);

  const d2p = Math.hypot(p.x - b.x, p.y - b.y);
  if (d2p < b.r + p.r) hurtPlayer(cfg.dmg);

  b.burstT -= dt;
  if (b.burstT <= 0) {
    b.burstT = cfg.burst * speedK;
    const n = cfg.burstN + (b.phase ? 6 : 0);
    const off = rand(0, TAU);
    for (let i = 0; i < n; i++) {
      const a = off + i / n * TAU;
      S.ebul.push({
        x: b.x + Math.cos(a) * b.r, y: b.y + Math.sin(a) * b.r,
        vx: Math.cos(a) * 168, vy: Math.sin(a) * 168,
        r: 8, dmg: 10 + S.act * 2, life: 5, color: b.color, src: b.name
      });
    }
    sfx('shoot');
    S.shake = Math.max(S.shake, 4);
  }
  b.aimT -= dt;
  if (b.aimT <= 0) {
    b.aimT = cfg.aim * speedK;
    const a0 = Math.atan2(p.y - b.y, p.x - b.x);
    for (let i = -1; i <= 1; i++) {
      const a = a0 + i * 0.16;
      S.ebul.push({
        x: b.x + Math.cos(a) * (b.r + 6), y: b.y + Math.sin(a) * (b.r + 6),
        vx: Math.cos(a) * 300, vy: Math.sin(a) * 300,
        r: 7, dmg: 9 + S.act * 2, life: 3.4, color: '#ff9aa8', src: b.name
      });
    }
  }
  b.dashT -= dt;
  if (b.dashT <= 0) {
    b.dashT = (6.2 - S.act * 0.4) * speedK;
    const a = Math.atan2(p.y - b.y, p.x - b.x);
    b.dvx = Math.cos(a) * 460;
    b.dvy = Math.sin(a) * 460;
    b.dashTime = 0.55;
    burstParticles(b.x, b.y, b.color, 18);
  }
  b.summonT -= dt;
  if (b.summonT <= 0) {
    b.summonT = 9.5;
    const list = ACTS[S.act].hordeA;
    for (let i = 0; i < 3; i++) {
      const a = rand(0, TAU);
      spawnEnemyAt(pick(list), clamp(b.x + Math.cos(a) * 90, 60, W - 60), clamp(b.y + Math.sin(a) * 90, 60, H - 60));
    }
  }
}

function bossDie() {
  const b = S.boss;
  if (!b || b.dead) return;
  b.dead = true;
  S.boss = null;
  for (let i = 0; i < 5; i++) {
    S.effects.push({ type: 'nova', x: b.x + rand(-40, 40), y: b.y + rand(-40, 40), r0: 10, r1: 260, color: b.color, t: 0, dur: 0.6 + i * 0.12 });
  }
  burstParticles(b.x, b.y, b.color, 80);
  S.score += 500;
  S.kills++;
  S.shake = 30;
  S.hitFlash = 1.4;
  sfx('die');
  for (const e of S.enemies.slice()) killEnemy(e);
  S.ebul.length = 0;
}

/* ------------------------ 波次 / 流程 ------------------------ */
function clearField() {
  S.boss = null;
  S.enemies.length = 0;
  S.pbul.length = 0;
  S.ebul.length = 0;
  S.rings.length = 0;
  S.effects.length = 0;
  S.pickups.length = 0;
  S.horde = null;
  S.banner = null;
}

function startStage() {
  const act = ACTS[S.act];
  clearField();
  S.mode = 'play';
  hideUI();
  S.time = 0;
  S.bossDone = false;
  if (S.stage < 2) {
    const list = S.stage === 0 ? act.hordeA : act.hordeB;
    S.horde = { q: list.slice(), t: 0.7, interval: 0.5 };
    banner(act.name, S.stage === 0 ? '第一波 · 清场' : '第二波 · 增援', act.pal.accent);
  } else {
    spawnBoss();
    banner(act.name, 'BOSS · ' + act.boss.name, act.pal.accent);
  }
  S.rulesOn = S.act === ACTS.length - 1;
  S.stillT = 0;
}

function stageClear() {
  if (S.mode !== 'play') return;
  for (const e of S.enemies) { e.dead = true; burstParticles(e.x, e.y, e.color, 6); }
  S.enemies.length = 0;
  clearField();
  if (S.stage === 2 && S.act === ACTS.length - 1) { victory(); return; }
  S.mode = 'card';
  showCards();
}

function afterCard() {
  if (S.stage === 2) {
    S.act++;
    S.stage = 0;
    if (S.act >= ACTS.length) { victory(); return; }
  } else {
    S.stage++;
  }
  const p = S.player;
  p.hp = Math.min(p.maxHp, p.hp + 20);
  p.rage = Math.min(p.maxRage, p.rage + 20);
  p.x = W / 2;
  p.y = S.act === ACTS.length - 1 ? H * 0.74 : H / 2;
  startStage();
}

function banner(t, s, color) {
  S.banner = { title: t, sub: s, color: color || '#fff', t: 0, dur: 2.4 };
}

/* ------------------------ 主循环更新 ------------------------ */
function update(dt) {
  S.time += dt;
  if (S.shake > 0) S.shake = Math.max(0, S.shake - dt * 34);
  if (S.hitFlash > 0) S.hitFlash = Math.max(0, S.hitFlash - dt * 3);
  if (S.banner) { S.banner.t += dt; if (S.banner.t > S.banner.dur) S.banner = null; }
  if (S.comboT > 0) { S.comboT -= dt; if (S.comboT <= 0) S.combo = 0; }

  const p = S.player;
  if (!p) return;

  p.atkCd = Math.max(0, p.atkCd - dt);
  p.dashCd = Math.max(0, p.dashCd - dt);
  p.swapCd = Math.max(0, p.swapCd - dt);
  p.iframe = Math.max(0, p.iframe - dt);
  p.atkBoostT = Math.max(0, p.atkBoostT - dt);
  p.hitFlash = Math.max(0, p.hitFlash - dt * 4);
  p.swingT = Math.max(0, p.swingT - dt);
  if (p.transformTime > 0) p.transformTime -= dt;
  if (p.transformCd > 0) p.transformCd -= dt;

  let mx = 0, my = 0;
  if (keys['w'] || keys['arrowup']) my -= 1;
  if (keys['s'] || keys['arrowdown']) my += 1;
  if (keys['a'] || keys['arrowleft']) mx -= 1;
  if (keys['d'] || keys['arrowright']) mx += 1;

  const oldX = p.x, oldY = p.y;

  if (p.dashTime > 0) {
    p.dashTime -= dt;
    p.x += p.dvx * dt;
    p.y += p.dvy * dt;
    p.trail.push({ x: p.x, y: p.y, t: 0.3, c: p.transformTime > 0 ? '#ffe9a8' : BLOOD[p.blood].color });
    if (p.ultDash > 0) {
      p.ultDash -= dt;
      const dmg = 60 * (1 + 0.08 * p.bl[2]) * p.mods.ultPower * p.mods.dmgAll;
      for (const e of S.enemies) {
        if (e.dead || p.ultHit.indexOf(e.uid) >= 0) continue;
        if (Math.hypot(e.x - p.x, e.y - p.y) < 66 + e.r) {
          p.ultHit.push(e.uid);
          dealDamage(e, dmg, true);
        }
      }
      if (S.boss && !S.boss.dead && p.ultHit.indexOf(0) < 0 && Math.hypot(S.boss.x - p.x, S.boss.y - p.y) < 66 + S.boss.r) {
        p.ultHit.push(0);
        dealDamage(S.boss, dmg, true);
      }
      if (Math.random() < 0.6) burstOne(p.x, p.y, '#ff5569');
    }
  } else {
    if (mx || my) {
      const len = Math.hypot(mx, my);
      const spd = p.speed * p.mods.speed * (p.transformTime > 0 ? 1.25 : 1);
      p.x += mx / len * spd * dt;
      p.y += my / len * spd * dt;
    }
  }
  p.x = clamp(p.x, 26, W - 26);
  p.y = clamp(p.y, 26, H - 26);
  p.facing = Math.atan2(mouse.y - p.y, mouse.x - p.x);

  if (mouse.down || keys['j']) doAttack();

  for (let i = p.trail.length - 1; i >= 0; i--) {
    p.trail[i].t -= dt;
    if (p.trail[i].t <= 0) p.trail.splice(i, 1);
  }

  /* 规则怪谈 */
  if (S.rulesOn) {
    const moved = Math.hypot(p.x - oldX, p.y - oldY);
    if (moved < 5) S.stillT += dt; else S.stillT = 0;
    if (S.stillT > 2) {
      p.hp -= 7 * dt * (1 - p.mods.armor);
      p.hitFlash = 0.2;
      S.hitFlash = Math.max(S.hitFlash, 0.25);
      if (Math.random() < 0.02) addText(p.x, p.y - 46, '停滞侵蚀', '#e9e9ff', 14);
      if (p.hp <= 0) { gameOver(); return; }
    }
    const dc = Math.hypot(p.x - W / 2, p.y - H / 2);
    if (dc < 132) {
      p.hp -= 9 * dt * (1 - p.mods.armor);
      p.hitFlash = 0.2;
      S.hitFlash = Math.max(S.hitFlash, 0.25);
      if (p.hp <= 0) { gameOver(); return; }
    }
  }

  /* 波次生成 */
  if (S.horde) {
    S.horde.t -= dt;
    if (S.horde.t <= 0 && S.horde.q.length > 0) {
      spawnEnemy(S.horde.q.shift());
      S.horde.t = S.horde.interval;
    }
    if (S.horde.q.length === 0 && S.enemies.filter(e => !e.forbidden).length === 0) { S.horde = null; stageClear(); return; }
  }
  if (S.stage === 2 && !S.boss && !S.bossDone && S.enemies.length === 0) {
    S.bossDone = true;
    stageClear();
    return;
  }

  updateEnemies(dt);
  updateBoss(dt);

  /* 玩家子弹 */
  for (let i = S.pbul.length - 1; i >= 0; i--) {
    const b = S.pbul[i];
    b.x += b.vx * dt; b.y += b.vy * dt; b.life -= dt;
    if (b.kind === 'shuriken') b.spin = (b.spin || 0) + dt * 18;
    if (b.life <= 0 || b.x < -40 || b.x > W + 40 || b.y < -40 || b.y > H + 40) {
      S.pbul.splice(i, 1); continue;
    }
    let removed = false;
    for (const e of S.enemies) {
      if (e.dead || b.hits.indexOf(e.uid) >= 0) continue;
      if (Math.hypot(e.x - b.x, e.y - b.y) < e.r + b.r) {
        b.hits.push(e.uid);
        dealDamage(e, b.dmg);
        burstOne(b.x, b.y, b.color);
        b.pierce--;
        if (b.pierce <= 0) { S.pbul.splice(i, 1); removed = true; break; }
      }
    }
    if (removed) continue;
    const bs = S.boss;
    if (bs && !bs.dead && b.hits.indexOf(0) < 0 && Math.hypot(bs.x - b.x, bs.y - b.y) < bs.r + b.r) {
      b.hits.push(0);
      dealDamage(bs, b.dmg);
      b.pierce--;
      if (b.pierce <= 0) S.pbul.splice(i, 1);
    }
  }

  /* 敌人子弹 */
  for (let i = S.ebul.length - 1; i >= 0; i--) {
    const b = S.ebul[i];
    b.x += b.vx * dt; b.y += b.vy * dt; b.life -= dt;
    if (b.life <= 0 || b.x < -50 || b.x > W + 50 || b.y < -50 || b.y > H + 50) {
      S.ebul.splice(i, 1); continue;
    }
    if (Math.hypot(p.x - b.x, p.y - b.y) < p.r + b.r) {
      S.ebul.splice(i, 1);
      hurtPlayer(b.dmg);
      burstOne(b.x, b.y, b.color);
    }
  }

  /* 暗域冲击环 */
  for (let i = S.rings.length - 1; i >= 0; i--) {
    const r = S.rings[i];
    if (!r.done) {
      r.r += 420 * dt;
      if (r.r >= r.max) r.done = true;
      for (const e of S.enemies) {
        if (e.dead || r.hits.indexOf(e.uid) >= 0) continue;
        const d = Math.hypot(e.x - r.x, e.y - r.y);
        if (d < r.r && d > r.r - 70) {
          r.hits.push(e.uid);
          dealDamage(e, r.dmg);
          e.slowT = Math.max(e.slowT, r.slow);
          e.x += (e.x - r.x) / (d || 1) * 60;
          e.y += (e.y - r.y) / (d || 1) * 60;
        }
      }
      if (S.boss && !S.boss.dead && r.hits.indexOf(0) < 0) {
        const d = Math.hypot(S.boss.x - r.x, S.boss.y - r.y);
        if (d < r.r && d > r.r - 80) { r.hits.push(0); dealDamage(S.boss, r.dmg); }
      }
    }
    r.life += dt;
    if (r.done && r.life > 0.5) S.rings.splice(i, 1);
  }

  /* 特效 */
  for (let i = S.effects.length - 1; i >= 0; i--) {
    const e = S.effects[i];
    e.t += dt;
    if (e.type === 'void') {
      e.tick -= dt;
      if (e.tick <= 0) {
        e.tick = 0.25;
        for (const en of S.enemies) {
          if (en.dead) continue;
          const d = Math.hypot(en.x - e.x, en.y - e.y);
          if (d < e.r * 1.6) {
            dealDamage(en, 11 * e.pow);
            if (d > 4) { en.x -= (en.x - e.x) / d * 42; en.y -= (en.y - e.y) / d * 42; }
          }
        }
        if (S.boss && !S.boss.dead) {
          const d = Math.hypot(S.boss.x - e.x, S.boss.y - e.y);
          if (d < e.r * 1.7) dealDamage(S.boss, 9 * e.pow);
        }
      }
    }
    if (e.t > e.dur) S.effects.splice(i, 1);
  }

  /* 粒子 / 文字 */
  for (let i = S.parts.length - 1; i >= 0; i--) {
    const q = S.parts[i];
    q.x += q.vx * dt; q.y += q.vy * dt;
    q.vx *= 0.94; q.vy *= 0.94;
    q.t -= dt;
    if (q.t <= 0) S.parts.splice(i, 1);
  }
  for (let i = S.texts.length - 1; i >= 0; i--) {
    const t = S.texts[i];
    t.y -= 42 * dt;
    t.t -= dt;
    if (t.t <= 0) S.texts.splice(i, 1);
  }
}

/* ------------------------ 粒子 / 文字 ------------------------ */
function burstParticles(x, y, color, n) {
  if (S.parts.length > 260) return;
  for (let i = 0; i < n; i++) {
    const a = rand(0, TAU), s = rand(40, 320);
    S.parts.push({ x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s, t: rand(0.25, 0.7), max: 0.7, r: rand(1.5, 4.5), color });
  }
}
function burstOne(x, y, color) {
  if (S.parts.length > 260) return;
  const a = rand(0, TAU), s = rand(60, 220);
  S.parts.push({ x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s, t: 0.3, max: 0.3, r: rand(1.5, 3.5), color });
}
function addText(x, y, s, color, size) {
  if (S.texts.length > 60) S.texts.shift();
  S.texts.push({ x, y, s: s, color: color || '#fff', size: size || 14, t: 0.75, max: 0.75 });
}

/* ------------------------ 绘制 ------------------------ */
function drawBg(act) {
  const pal = act.pal;
  const g = ctx.createLinearGradient(0, 0, 0, H);
  g.addColorStop(0, pal.bg1);
  g.addColorStop(1, pal.bg2);
  ctx.fillStyle = g;
  ctx.fillRect(0, 0, W, H);

  const rg = ctx.createRadialGradient(W / 2, H / 2, 60, W / 2, H / 2, 760);
  rg.addColorStop(0, 'rgba(' + pal.rgb + ',0.13)');
  rg.addColorStop(1, 'rgba(' + pal.rgb + ',0)');
  ctx.fillStyle = rg;
  ctx.fillRect(0, 0, W, H);

  ctx.strokeStyle = 'rgba(' + pal.rgb + ',0.07)';
  ctx.lineWidth = 1.5;
  const gs = 116;
  const off = (S.time * 8) % gs;
  ctx.beginPath();
  for (let x = -gs + off; x < W + gs; x += gs) { ctx.moveTo(x, 0); ctx.lineTo(x, H); }
  for (let y = -gs + off; y < H + gs; y += gs) { ctx.moveTo(0, y); ctx.lineTo(W, y); }
  ctx.stroke();

  ctx.strokeStyle = 'rgba(' + pal.rgb + ',0.35)';
  ctx.lineWidth = 2;
  ctx.strokeRect(14, 14, W - 28, H - 28);
  ctx.strokeStyle = 'rgba(' + pal.rgb + ',0.08)';
  ctx.lineWidth = 14;
  ctx.strokeRect(14, 14, W - 28, H - 28);

  for (let i = 0; i < 26; i++) {
    const px = (i * 197 + S.time * 12) % W;
    const py = (i * 311 + Math.sin(S.time * 0.6 + i) * 40 + S.time * 5) % H;
    ctx.fillStyle = 'rgba(' + pal.rgb + ',0.16)';
    ctx.beginPath();
    ctx.arc(px, py, 1.8 + (i % 3), 0, TAU);
    ctx.fill();
  }

  if (S.act === ACTS.length - 1) drawAbyss();
}

function drawAbyss() {
  const cx = W / 2, cy = H / 2;
  glow(cx, cy, 300, '#b47bff', 0.22);
  ctx.save();
  ctx.beginPath();
  ctx.arc(cx, cy, 132, 0, TAU);
  const g = ctx.createRadialGradient(cx, cy, 4, cx, cy, 132);
  g.addColorStop(0, '#000');
  g.addColorStop(0.55, 'rgba(30,10,50,0.9)');
  g.addColorStop(1, 'rgba(120,70,200,0.35)');
  ctx.fillStyle = g;
  ctx.fill();
  ctx.strokeStyle = 'rgba(180,140,255,' + (0.35 + Math.sin(S.time * 3) * 0.15) + ')';
  ctx.lineWidth = 2;
  ctx.stroke();
  ctx.strokeStyle = 'rgba(180,140,255,0.4)';
  for (let i = 0; i < 7; i++) {
    const a = S.time * 0.5 + i / 7 * TAU;
    ctx.beginPath();
    ctx.moveTo(cx + Math.cos(a) * 120, cy + Math.sin(a) * 120);
    ctx.quadraticCurveTo(
      cx + Math.cos(a + 0.4) * 160, cy + Math.sin(a + 0.4) * 160,
      cx + Math.cos(a + 0.8) * 130, cy + Math.sin(a + 0.8) * 130
    );
    ctx.stroke();
  }
  ctx.restore();
}

function drawEnemies() {
  for (const e of S.enemies) drawEnemyShape(e);
}

function drawEnemyShape(e) {
  const col = e.color;
  ctx.save();
  ctx.globalAlpha = 0.28;
  ctx.fillStyle = '#000';
  ctx.beginPath();
  ctx.ellipse(e.x, e.y + e.r * 0.85, e.r * 0.85, e.r * 0.32, 0, 0, TAU);
  ctx.fill();
  ctx.globalAlpha = 1;

  glow(e.x, e.y, e.r * 2.6, col, e.forbidden ? 0.26 : 0.42);

  const pulse = 1 + Math.sin(e.t * 4) * 0.03;
  ctx.translate(e.x, e.y);
  ctx.scale(pulse, pulse);

  if (e.sides === 0) {
    ctx.fillStyle = he(col, 0.15);
    ctx.beginPath(); ctx.arc(0, 0, e.r, 0, TAU); ctx.fill();
    ctx.strokeStyle = he(col, 0.9); ctx.lineWidth = 2; ctx.stroke();
    const a = Math.atan2(S.player.y - e.y, S.player.x - e.x);
    ctx.fillStyle = '#100a18';
    ctx.beginPath(); ctx.arc(Math.cos(a) * e.r * 0.3, Math.sin(a) * e.r * 0.3, e.r * 0.55, 0, TAU); ctx.fill();
    ctx.fillStyle = col;
    ctx.beginPath(); ctx.arc(Math.cos(a) * e.r * 0.3, Math.sin(a) * e.r * 0.3, e.r * 0.32, 0, TAU); ctx.fill();
  } else {
    const rot = e.t * (e.ai === 'orbit' ? 2.2 : 0.6) + e.wob;
    ctx.beginPath();
    for (let i = 0; i < e.sides; i++) {
      const a = rot + i / e.sides * TAU;
      const px = Math.cos(a) * e.r, py = Math.sin(a) * e.r * (e.forbidden ? 1.18 : 1);
      if (i) ctx.lineTo(px, py); else ctx.moveTo(px, py);
    }
    ctx.closePath();
    ctx.fillStyle = he(col, e.forbidden ? 0.14 : 0.24);
    ctx.fill();
    ctx.strokeStyle = he(col, 1);
    ctx.lineWidth = 2;
    ctx.stroke();
    ctx.fillStyle = he(col, 0.8);
    ctx.beginPath(); ctx.arc(0, 0, e.r * 0.32, 0, TAU); ctx.fill();
    const a2 = Math.atan2(S.player.y - e.y, S.player.x - e.x);
    ctx.fillStyle = '#0b0610';
    ctx.beginPath(); ctx.arc(Math.cos(a2) * 3.5, Math.sin(a2) * 3.5, e.r * 0.24, 0, TAU); ctx.fill();
  }

  if (e.flash > 0) {
    ctx.globalCompositeOperation = 'lighter';
    ctx.fillStyle = 'rgba(255,255,255,' + (e.flash / 0.16) * 0.55 + ')';
    ctx.beginPath(); ctx.arc(0, 0, e.r + 2, 0, TAU); ctx.fill();
    ctx.globalCompositeOperation = 'source-over';
  }
  ctx.restore();

  if (e.hp < e.maxHp) {
    const w = e.r * 2.1;
    ctx.fillStyle = 'rgba(0,0,0,0.6)';
    ctx.fillRect(e.x - w / 2, e.y - e.r - 11, w, 4);
    ctx.fillStyle = he(col, 0.95);
    ctx.fillRect(e.x - w / 2, e.y - e.r - 11, w * clamp(e.hp / e.maxHp, 0, 1), 4);
  }
}

function drawBoss() {
  const b = S.boss;
  if (!b) return;
  ctx.save();
  glow(b.x, b.y, b.r * 3.4, b.color, 0.42);
  ctx.translate(b.x, b.y);

  for (let ring = 0; ring < 2; ring++) {
    ctx.save();
    ctx.rotate(b.ang * (ring ? -1 : 1) * 0.7);
    ctx.strokeStyle = he(b.color, ring ? 0.3 : 0.6);
    ctx.lineWidth = ring ? 2 : 3;
    ctx.beginPath();
    const R = b.r + 18 + ring * 14;
    for (let i = 0; i < 8; i++) {
      const a = i / 8 * TAU;
      ctx.lineTo(Math.cos(a) * R, Math.sin(a) * R);
    }
    ctx.closePath();
    ctx.stroke();
    ctx.restore();
  }

  const t = b.t * 1.5;
  ctx.beginPath();
  for (let i = 0; i < 7; i++) {
    const a = t + i / 7 * TAU;
    const R = b.r * (1 + Math.sin(t * 2 + i) * 0.05);
    if (i) ctx.lineTo(Math.cos(a) * R, Math.sin(a) * R); else ctx.moveTo(Math.cos(a) * R, Math.sin(a) * R);
  }
  ctx.closePath();
  const g = ctx.createRadialGradient(0, 0, 6, 0, 0, b.r);
  g.addColorStop(0, he(b.color, 0.9));
  g.addColorStop(0.5, he(b.color, 0.28));
  g.addColorStop(1, 'rgba(0,0,0,0.85)');
  ctx.fillStyle = g;
  ctx.fill();
  ctx.strokeStyle = he(b.color, 0.95);
  ctx.lineWidth = 3;
  ctx.stroke();

  const ae = Math.atan2(S.player.y - b.y, S.player.x - b.x);
  ctx.fillStyle = '#07030d';
  ctx.beginPath(); ctx.arc(Math.cos(ae) * b.r * 0.22, Math.sin(ae) * b.r * 0.22, b.r * 0.42, 0, TAU); ctx.fill();
  ctx.fillStyle = b.phase ? '#ff4d6a' : b.color;
  ctx.beginPath(); ctx.arc(Math.cos(ae) * b.r * 0.22, Math.sin(ae) * b.r * 0.22, b.r * 0.2, 0, TAU); ctx.fill();

  if (b.flash > 0) {
    ctx.globalCompositeOperation = 'lighter';
    ctx.fillStyle = 'rgba(255,255,255,' + (b.flash / 0.16) * 0.5 + ')';
    ctx.beginPath(); ctx.arc(0, 0, b.r + 4, 0, TAU); ctx.fill();
    ctx.globalCompositeOperation = 'source-over';
  }
  ctx.restore();

  const bw = 620, bx = (W - bw) / 2, by = 68;
  ctx.fillStyle = 'rgba(0,0,0,0.55)';
  rr(bx - 12, by - 12, bw + 24, 46, 8); ctx.fill();
  ctx.fillStyle = 'rgba(255,255,255,0.1)';
  rr(bx, by, bw, 12, 6); ctx.fill();
  const hpw = bw * clamp(b.hp / b.maxHp, 0, 1);
  const gg = ctx.createLinearGradient(bx, 0, bx + bw, 0);
  gg.addColorStop(0, he(b.color, 0.7));
  gg.addColorStop(1, b.color);
  ctx.fillStyle = gg;
  rr(bx, by, Math.max(2, hpw), 12, 6); ctx.fill();
  txt(b.name, bx, by + 26, 14, '#e6ecff', 'left', 'bold');
  txt(Math.ceil(b.hp) + ' / ' + b.maxHp, bx + bw, by + 26, 12, 'rgba(230,236,255,.6)', 'right', '600');
}

function drawPlayer() {
  const p = S.player;
  if (!p) return;
  const col = p.transformTime > 0 ? '#ffe9a8' : BLOOD[p.blood].color;

  for (const t of p.trail) {
    ctx.fillStyle = he(t.c, t.t / 0.3 * 0.4);
    ctx.beginPath();
    ctx.arc(t.x, t.y, p.r * 0.9, 0, TAU);
    ctx.fill();
  }

  ctx.save();
  ctx.globalAlpha = 0.3;
  ctx.fillStyle = '#000';
  ctx.beginPath();
  ctx.ellipse(p.x, p.y + p.r * 0.9, p.r * 0.9, p.r * 0.33, 0, 0, TAU);
  ctx.fill();
  ctx.globalAlpha = 1;

  glow(p.x, p.y, p.r * 3.2, col, 0.4);

  if (p.swingT > 0) {
    const k = 1 - p.swingT / 0.24;
    ctx.save();
    ctx.translate(p.x, p.y);
    ctx.rotate(p.swingAng);
    const R = (94 + 9 * p.bl[0]) * p.mods.range;
    ctx.strokeStyle = he(col, (1 - k) * 0.85);
    ctx.lineWidth = 14 * (1 - k) + 2;
    ctx.beginPath();
    ctx.arc(0, 0, R * (0.55 + k * 0.45), -Math.PI * 0.33, Math.PI * 0.33);
    ctx.stroke();
    ctx.strokeStyle = 'rgba(255,255,255,' + (1 - k) * 0.5 + ')';
    ctx.lineWidth = 3;
    ctx.beginPath();
    ctx.arc(0, 0, R * (0.5 + k * 0.5), -Math.PI * 0.3, Math.PI * 0.3);
    ctx.stroke();
    ctx.restore();
  }

  ctx.save();
  ctx.translate(p.x, p.y);
  if (p.transformTime > 0) {
    ctx.rotate(S.time * 6);
    ctx.strokeStyle = he('#ffe9a8', 0.9);
    ctx.lineWidth = 3;
    for (let i = 0; i < 6; i++) {
      ctx.beginPath();
      ctx.moveTo(0, 0);
      const a = i / 6 * TAU;
      ctx.lineTo(Math.cos(a) * (p.r + 16), Math.sin(a) * (p.r + 16));
      ctx.stroke();
    }
    ctx.beginPath();
    ctx.arc(0, 0, p.r + 20, 0, TAU);
    ctx.strokeStyle = he('#ffe9a8', 0.45);
    ctx.lineWidth = 2;
    ctx.stroke();
  } else {
    ctx.rotate(-S.time * 2.4);
    ctx.strokeStyle = he(col, 0.5);
    ctx.lineWidth = 2;
    for (let i = 0; i < 4; i++) {
      ctx.beginPath();
      const a = i / 4 * TAU;
      ctx.arc(0, 0, p.r + 8, a, a + 0.6);
      ctx.stroke();
    }
  }
  ctx.restore();

  const bg = ctx.createRadialGradient(p.x - 4, p.y - 6, 2, p.x, p.y, p.r);
  bg.addColorStop(0, '#ffffff');
  bg.addColorStop(0.45, col);
  bg.addColorStop(1, he(col, 0.25));
  ctx.fillStyle = bg;
  ctx.beginPath();
  ctx.arc(p.x, p.y, p.r, 0, TAU);
  ctx.fill();
  ctx.strokeStyle = 'rgba(255,255,255,.9)';
  ctx.lineWidth = 2;
  ctx.stroke();

  ctx.save();
  ctx.translate(p.x, p.y);
  ctx.rotate(p.facing);
  ctx.fillStyle = 'rgba(8,10,20,.88)';
  ctx.beginPath();
  ctx.ellipse(p.r * 0.42, 0, p.r * 0.46, p.r * 0.62, 0, 0, TAU);
  ctx.fill();
  ctx.fillStyle = p.transformTime > 0 ? '#ffffff' : col;
  ctx.beginPath(); ctx.arc(p.r * 0.55, -p.r * 0.22, 2.6, 0, TAU); ctx.fill();
  ctx.beginPath(); ctx.arc(p.r * 0.55, p.r * 0.22, 2.6, 0, TAU); ctx.fill();
  ctx.restore();

  if (p.hitFlash > 0) {
    ctx.globalCompositeOperation = 'lighter';
    ctx.fillStyle = 'rgba(255,255,255,' + p.hitFlash * 0.8 + ')';
    ctx.beginPath(); ctx.arc(p.x, p.y, p.r + 3, 0, TAU); ctx.fill();
    ctx.globalCompositeOperation = 'source-over';
  }

  if (p.iframe > 0 && Math.floor(p.iframe * 20) % 2 === 0) {
    ctx.strokeStyle = 'rgba(255,255,255,.85)';
    ctx.lineWidth = 2;
    ctx.beginPath(); ctx.arc(p.x, p.y, p.r + 6, 0, TAU); ctx.stroke();
  }
  ctx.restore();
}

function drawPickups() {
  for (const it of S.pickups) {
    const col = it.kind === 'hp' ? '#8dffab' : '#ffd161';
    const s = 9 + Math.sin(it.t * 6) * 1.6;
    glow(it.x, it.y, 26, col, 0.5);
    ctx.save();
    ctx.translate(it.x, it.y);
    ctx.rotate(it.t * 2);
    ctx.fillStyle = he(col, 0.9);
    if (it.kind === 'hp') {
      ctx.fillRect(-s / 2, -2.5, s, 5);
      ctx.fillRect(-2.5, -s / 2, 5, s);
    } else {
      ctx.beginPath();
      ctx.moveTo(0, -s * 0.8); ctx.lineTo(s * 0.55, s * 0.1);
      ctx.lineTo(0, s * 0.75); ctx.lineTo(-s * 0.55, s * 0.1);
      ctx.closePath(); ctx.fill();
    }
    ctx.restore();
  }
}

function drawPBullets() {
  for (const b of S.pbul) {
    if (b.kind === 'beam') {
      ctx.save();
      ctx.translate(b.x, b.y);
      ctx.rotate(Math.atan2(b.vy, b.vx));
      const g = ctx.createLinearGradient(-22, 0, 14, 0);
      g.addColorStop(0, he(b.color, 0));
      g.addColorStop(0.6, he(b.color, 0.9));
      g.addColorStop(1, '#ffffff');
      ctx.fillStyle = g;
      ctx.beginPath();
      ctx.ellipse(0, 0, 26, 4.2, 0, 0, TAU);
      ctx.fill();
      ctx.restore();
      glow(b.x, b.y, 22, b.color, 0.4);
    } else {
      ctx.save();
      ctx.translate(b.x, b.y);
      ctx.rotate(b.spin || 0);
      for (let i = 0; i < 3; i++) {
        ctx.save();
        ctx.rotate(i / 3 * TAU);
        ctx.beginPath();
        ctx.moveTo(0, -7); ctx.lineTo(3, 0); ctx.lineTo(0, 7); ctx.lineTo(-3, 0);
        ctx.closePath();
        ctx.fillStyle = i === 0 ? '#fff' : he(b.color, 0.85);
        ctx.fill();
        ctx.restore();
      }
      ctx.restore();
      glow(b.x, b.y, 16, b.color, 0.45);
    }
  }
}

function drawEBullets() {
  for (const b of S.ebul) {
    glow(b.x, b.y, b.r * 2.6, b.color, 0.45);
    ctx.fillStyle = he(b.color, 0.95);
    ctx.beginPath();
    ctx.arc(b.x, b.y, b.r, 0, TAU);
    ctx.fill();
    ctx.fillStyle = 'rgba(255,255,255,.85)';
    ctx.beginPath();
    ctx.arc(b.x, b.y, b.r * 0.42, 0, TAU);
    ctx.fill();
  }
}

function drawRings() {
  for (const r of S.rings) {
    ctx.strokeStyle = he(r.color, clamp(1 - r.r / r.max, 0, 1) * 0.9);
    ctx.lineWidth = 16;
    ctx.beginPath();
    ctx.arc(r.x, r.y, r.r, 0, TAU);
    ctx.stroke();
    ctx.strokeStyle = 'rgba(255,255,255,.5)';
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.arc(r.x, r.y, r.r - 6, 0, TAU);
    ctx.stroke();
  }
}

function drawEffects() {
  for (const e of S.effects) {
    const k = e.t / e.dur;
    if (e.type === 'nova') {
      const r = e.r0 + (e.r1 - e.r0) * k;
      ctx.strokeStyle = he(e.color, (1 - k) * 0.9);
      ctx.lineWidth = 20 * (1 - k) + 2;
      ctx.beginPath(); ctx.arc(e.x, e.y, r, 0, TAU); ctx.stroke();
      ctx.strokeStyle = 'rgba(255,255,255,' + (1 - k) * 0.6 + ')';
      ctx.lineWidth = 4;
      ctx.beginPath(); ctx.arc(e.x, e.y, r * 0.94, 0, TAU); ctx.stroke();
    } else if (e.type === 'beam') {
      ctx.save();
      ctx.translate(e.x, e.y);
      ctx.rotate(e.a);
      const g = ctx.createLinearGradient(0, -e.w / 2, 0, e.w / 2);
      g.addColorStop(0, he(e.color, 0));
      g.addColorStop(0.5, 'rgba(255,255,255,' + (1 - k) * 0.9 + ')');
      g.addColorStop(1, he(e.color, 0));
      ctx.fillStyle = g;
      ctx.fillRect(0, -e.w / 2, e.len, e.w);
      ctx.fillStyle = he(e.color, (1 - k) * 0.8);
      ctx.fillRect(0, -e.w * 0.18, e.len, e.w * 0.36);
      ctx.restore();
    } else if (e.type === 'void') {
      const rr2 = e.r * (0.8 + Math.sin(e.t * 6) * 0.04);
      ctx.save();
      ctx.globalAlpha = clamp(e.t * 4, 0, 1) * clamp((e.dur - e.t) * 2, 0, 1);
      ctx.fillStyle = 'rgba(6,2,14,.85)';
      ctx.beginPath(); ctx.arc(e.x, e.y, rr2, 0, TAU); ctx.fill();
      ctx.strokeStyle = he(e.color, 0.6);
      ctx.lineWidth = 3;
      for (let i = 0; i < 3; i++) {
        ctx.beginPath();
        ctx.arc(e.x, e.y, rr2 - i * 16, e.t * (i + 1) * 2, e.t * (i + 1) * 2 + 2.2);
        ctx.stroke();
      }
      ctx.restore();
      glow(e.x, e.y, rr2, e.color, 0.25 * (1 - k));
    } else if (e.type === 'flame') {
      glow(e.x, e.y, 90 * (1 - k) + 40, '#ff5569', 0.4 * (1 - k));
    } else if (e.type === 'transform') {
      const r = 30 + k * 220;
      ctx.strokeStyle = he('#ffe9a8', (1 - k) * 0.95);
      ctx.lineWidth = 8 * (1 - k) + 1;
      ctx.beginPath(); ctx.arc(e.x, e.y, r, 0, TAU); ctx.stroke();
    }
  }
}

function drawParts() {
  ctx.globalCompositeOperation = 'lighter';
  for (const q of S.parts) {
    const a = clamp(q.t / q.max, 0, 1);
    ctx.fillStyle = he(q.color, a * 0.9);
    ctx.beginPath();
    ctx.arc(q.x, q.y, q.r * a + 0.6, 0, TAU);
    ctx.fill();
  }
  ctx.globalCompositeOperation = 'source-over';
}

function drawTexts() {
  for (const t of S.texts) {
    const a = clamp(t.t / t.max, 0, 1);
    ctx.globalAlpha = a;
    txt(t.s, t.x, t.y, t.size, t.color, 'center', 'bold');
    ctx.globalAlpha = 1;
  }
}

function drawHUD() {
  const p = S.player;
  if (!p) return;
  const act = ACTS[clamp(S.act, 0, ACTS.length - 1)];

  ctx.fillStyle = 'rgba(6,8,14,.58)';
  rr(22, 18, 350, 90, 12); ctx.fill();
  ctx.strokeStyle = 'rgba(255,255,255,.1)';
  ctx.lineWidth = 1;
  ctx.stroke();

  txt('气血', 36, 34, 11.5, 'rgba(230,236,255,.62)', 'left', '700');
  txt(Math.ceil(Math.max(0, p.hp)) + ' / ' + Math.round(p.maxHp), 356, 34, 11.5, '#ffd8de', 'right', 'bold');
  ctx.fillStyle = 'rgba(255,255,255,.08)';
  rr(36, 44, 320, 12, 6); ctx.fill();
  const hpk = clamp(p.hp / p.maxHp, 0, 1);
  const hg = ctx.createLinearGradient(36, 0, 356, 0);
  hg.addColorStop(0, '#ff4d6a');
  hg.addColorStop(1, '#ff9a6a');
  ctx.fillStyle = hg;
  rr(36, 44, Math.max(3, 320 * hpk), 12, 6); ctx.fill();

  const rk = p.rage / p.maxRage;
  ctx.fillStyle = 'rgba(255,255,255,.08)';
  rr(36, 84, 320, 8, 4); ctx.fill();
  const rgd = ctx.createLinearGradient(36, 0, 356, 0);
  rgd.addColorStop(0, '#8b6bff');
  rgd.addColorStop(1, '#ffd161');
  ctx.fillStyle = rgd;
  rr(36, 84, Math.max(2, 320 * rk), 8, 4); ctx.fill();
  txt('怒气', 36, 73, 11, 'rgba(230,236,255,.55)', 'left', '700');
  if (rk >= 1) {
    const pulse = 0.65 + Math.sin(S.time * 6) * 0.35;
    txt('E 必杀就绪', 356, 73, 11, 'rgba(255,209,97,' + pulse + ')', 'right', 'bold');
  } else {
    txt(Math.round(rk * 100) + '%', 356, 73, 11, 'rgba(255,209,97,.5)', 'right', '600');
  }

  const cn = (S.stage === 2 ? 'BOSS 战' : '第 ' + (S.stage + 1) + ' 波');
  txt(act.name, W / 2, 32, 15, 'rgba(240,245,255,.9)', 'center', 'bold');
  if (!S.boss) txt(act.tag + '   ·   ' + cn, W / 2, 52, 11.5, he(act.pal.accent, 0.75), 'center', '600');

  txt('SCORE', W - 40, 32, 10, 'rgba(255,255,255,.42)', 'right', '600');
  txt(String(S.score), W - 40, 56, 26, '#ffe6a8', 'right', 'bold');
  if (S.combo > 1) {
    txt('COMBO x' + S.combo, W - 40, 84, 14, '#ff8a9d', 'right', 'bold');
  }

  const chipW = 168, gap = 10, startX = 26, y0 = H - 88;
  for (let i = 0; i < 4; i++) {
    const b = BLOOD[i];
    const active = p.blood === i;
    const x = startX + i * (chipW + gap);
    ctx.fillStyle = active ? he(b.color, 0.16) : 'rgba(6,8,14,.6)';
    rr(x, y0, chipW, 56, 10); ctx.fill();
    ctx.strokeStyle = active ? he(b.color, 0.95) : 'rgba(255,255,255,.1)';
    ctx.lineWidth = active ? 2 : 1;
    rr(x, y0, chipW, 56, 10); ctx.stroke();
    if (active) glow(x + chipW / 2, y0 + 28, 60, b.color, 0.25);
    txt(b.key, x + 14, y0 + 20, 13, active ? b.color : 'rgba(255,255,255,.35)', 'left', 'bold');
    txt(b.name, x + 36, y0 + 20, 13, active ? '#ffffff' : 'rgba(220,228,245,.55)', 'left', 'bold');
    txt(b.style, x + 14, y0 + 40, 10.5, active ? he(b.color, 0.8) : 'rgba(255,255,255,.28)', 'left', '600');
    for (let k = 0; k < Math.min(6, p.bl[i] - 1); k++) {
      ctx.fillStyle = he(b.color, active ? 0.9 : 0.45);
      ctx.beginPath();
      ctx.arc(x + chipW - 14 - k * 9, y0 + 42, 3, 0, TAU);
      ctx.fill();
    }
  }

  const bx = W - 26 - 230;
  ctx.fillStyle = 'rgba(6,8,14,.6)';
  rr(bx, y0, 230, 56, 10); ctx.fill();
  ctx.strokeStyle = 'rgba(255,255,255,.1)';
  ctx.lineWidth = 1;
  rr(bx, y0, 230, 56, 10); ctx.stroke();

  const tfReady = p.transformCd <= 0;
  const tfOn = p.transformTime > 0;
  const barW = 190;
  ctx.fillStyle = 'rgba(255,255,255,.08)';
  rr(bx + 16, y0 + 14, barW, 9, 4.5); ctx.fill();
  const tfk = tfOn ? p.transformTime / (6.5 * p.mods.transformDur) : (tfReady ? 1 : 1 - p.transformCd / (24 * p.mods.transformCd));
  ctx.fillStyle = tfOn ? '#ffe9a8' : (tfReady ? 'rgba(255,233,168,.9)' : 'rgba(120,130,160,.6)');
  rr(bx + 16, y0 + 14, Math.max(2, barW * clamp(tfk, 0, 1)), 9, 4.5); ctx.fill();
  txt(tfOn ? '变身中' : (tfReady ? 'R 特摄变身' : '冷却 ' + Math.ceil(p.transformCd) + 's'),
    bx + 16, y0 + 40, 11.5, tfOn ? '#ffe9a8' : 'rgba(220,228,245,.65)', 'left', 'bold');

  ctx.fillStyle = 'rgba(255,255,255,.08)';
  rr(bx + 118, y0 + 34, 96, 7, 3.5); ctx.fill();
  ctx.fillStyle = 'rgba(120,220,255,.85)';
  rr(bx + 118, y0 + 34, Math.max(2, 96 * (1 - p.dashCd / (1.15 * p.mods.dashCd))), 7, 3.5); ctx.fill();
  txt('SPACE 闪避', bx + 118, y0 + 20, 10.5, 'rgba(150,220,255,.8)', 'left', '600');

  if (S.rulesOn) {
    const rx = W - 306, ry = 118;
    ctx.fillStyle = 'rgba(10,6,20,.82)';
    rr(rx, ry, 280, 116, 12); ctx.fill();
    ctx.strokeStyle = 'rgba(180,140,255,.5)';
    ctx.lineWidth = 1.5;
    rr(rx, ry, 280, 116, 12); ctx.stroke();
    txt('规则怪谈', rx + 16, ry + 20, 12, '#d8c4ff', 'left', 'bold');
    for (let i = 0; i < RULES.length; i++) {
      const bad = (i === 0 && S.stillT > 2);
      txt(RULES[i].text, rx + 16, ry + 44 + i * 22, 11, bad ? '#ff9aa8' : 'rgba(216,196,255,.68)', 'left', '600');
    }
  }
}

function drawBanner() {
  const b = S.banner;
  if (!b) return;
  const k = b.t / b.dur;
  let a = 1;
  if (k < 0.12) a = k / 0.12;
  if (k > 0.75) a = (1 - k) / 0.25;
  ctx.globalAlpha = clamp(a, 0, 1);
  const y = H * 0.34;
  ctx.fillStyle = 'rgba(0,0,0,.35)';
  ctx.fillRect(0, y - 52, W, 104);
  txt(b.title, W / 2, y - 12, 34, b.color, 'center', 'bold');
  txt(b.sub, W / 2, y + 26, 14, 'rgba(240,245,255,.8)', 'center', '600');
  ctx.globalAlpha = 1;
}

function drawVignette() {
  const g = ctx.createRadialGradient(W / 2, H / 2, H * 0.42, W / 2, H / 2, H * 0.95);
  g.addColorStop(0, 'rgba(0,0,0,0)');
  g.addColorStop(1, 'rgba(0,0,0,.55)');
  ctx.fillStyle = g;
  ctx.fillRect(0, 0, W, H);

  const p = S.player;
  if (p && p.hp / p.maxHp < 0.35) {
    const a = (1 - p.hp / p.maxHp / 0.35) * (0.25 + Math.sin(S.time * 5) * 0.08);
    const rgg = ctx.createRadialGradient(W / 2, H / 2, H * 0.3, W / 2, H / 2, H * 0.9);
    rgg.addColorStop(0, 'rgba(255,0,40,0)');
    rgg.addColorStop(1, 'rgba(255,0,40,' + clamp(a, 0, 0.5) + ')');
    ctx.fillStyle = rgg;
    ctx.fillRect(0, 0, W, H);
  }
  if (S.hitFlash > 0) {
    ctx.fillStyle = 'rgba(255,80,110,' + (S.hitFlash * 0.35) + ')';
    ctx.fillRect(0, 0, W, H);
  }
}

function draw() {
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.clearRect(0, 0, W, H);
  const act = ACTS[clamp(S.act, 0, ACTS.length - 1)];
  let sx = 0, sy = 0;
  if (S.shake > 0.4) { sx = rand(-S.shake, S.shake) * 0.6; sy = rand(-S.shake, S.shake) * 0.6; }
  ctx.save();
  ctx.translate(sx, sy);
  drawBg(act);
  drawPickups();
  drawRings();
  drawEffects();
  drawEnemies();
  drawBoss();
  drawPlayer();
  drawPBullets();
  drawEBullets();
  drawParts();
  drawTexts();
  ctx.restore();
  drawHUD();
  drawBanner();
  drawVignette();
}

function showCards() {
  const pool = CARDS.filter(c => S.taken.indexOf(c.id) < 0);
  const offers = [];
  const shuffledPool = pool.slice().sort(() => Math.random() - 0.5);
  for (const c of shuffledPool) {
    if (offers.length >= 3) break;
    if (c.rare && Math.random() < 0.6) continue;
    offers.push(c);
  }
  while (offers.length < 3) {
    offers.push({
      id: '__hp' + offers.length, tag: '通用', name: '气血充盈', color: '#9be15d',
      desc: '最大生命 +20，并回复 20 点气血。', apply: p => { p.maxHp += 20; p.hp = Math.min(p.maxHp, p.hp + 20); }
    });
  }
  const p = S.player;
  let html = '<div class="panel"><div class="head">选择一张共鸣</div>' +
    '<div class="sup">第 ' + (S.act + 1) + ' 界 · ' + (S.stage === 2 ? 'BOSS 已击破' : '清场完成') +
    '　｜　气血 ' + Math.ceil(p.hp) + '/' + p.maxHp + '　怒气 ' + Math.ceil(p.rage) + '　分数 ' + S.score + '</div><div class="cards">';
  for (const c of offers) {
    html += '<div class="card" style="--c:' + c.color + '" onclick="takeCard(\'' + c.id + '\')">' +
      '<div class="ctag">' + c.tag + '</div>' +
      '<div class="cname">' + c.name + '</div>' +
      '<div class="cdesc">' + c.desc + '</div>' +
      '<div class="clvl">点击选择</div></div>';
  }
  html += '</div></div>';
  showUI(html);
  S.offers = offers;
  sfx('pick');
}

function takeCard(id) {
  if (S.mode !== 'card') return;
  const c = (S.offers || []).filter(x => x.id === id)[0];
  if (c) {
    if (c.apply) c.apply(S.player);
    if (c.id.indexOf('__') !== 0) S.taken.push(c.id);
  }
  S.offers = null;
  hideUI();
  afterCard();
}

function pauseGame() {
  if (S.mode !== 'play') return;
  S.mode = 'pause';
  showUI('<div class="panel" style="max-width:520px"><div class="head">已暂停</div>' +
    '<div class="sup">按 P 或点击继续</div>' +
    '<div class="row"><button class="btn" onclick="resumeGame()">继续战斗</button>' +
    '<button class="btn ghost" onclick="startGame()">重新开始</button></div></div>');
}
function resumeGame() {
  if (S.mode !== 'pause') return;
  S.mode = 'play';
  hideUI();
}

function gameOver() {
  if (S.mode === 'dead') return;
  S.mode = 'dead';
  mouse.down = false;
  sfx('die');
  S.shake = 18;
  showUI('<div class="panel" style="max-width:560px"><div class="head">你被三界吞没了</div>' +
    '<div class="sup">倒在第 ' + (S.act + 1) + ' 界 · ' + (S.stage === 2 ? 'BOSS 战' : '第 ' + (S.stage + 1) + ' 波') + '</div>' +
    '<div class="stat">最终分数 <b>' + S.score + '</b>　击破 <b>' + S.kills + '</b>　最高连击 <b>' + S.bestCombo + '</b></div>' +
    '<div class="row"><button class="btn" onclick="startGame()">再来一局</button></div></div>');
}

function victory() {
  S.mode = 'win';
  mouse.down = false;
  showUI('<div class="panel" style="max-width:600px"><div class="kicker">ALL WORLDS CLEARED</div>' +
    '<div class="head">四界归一，你赢下了这场乱斗</div>' +
    '<div class="sup">西游的佛、特摄的光、日漫的火、怪谈的暗 —— 全都被你踩在脚下。</div>' +
    '<div class="stat">最终分数 <b>' + S.score + '</b>　击破 <b>' + S.kills + '</b>　最高连击 <b>' + S.bestCombo + '</b></div>' +
    '<div class="row"><button class="btn" onclick="startGame()">再打一次</button></div></div>');
}

/* ------------------------ 启动 ------------------------ */
function startGame() {
  S.mode = 'play';
  S.act = 0; S.stage = 0; S.time = 0; S.score = 0; S.combo = 0; S.comboT = 0;
  S.enemies = []; S.pbul = []; S.ebul = []; S.parts = []; S.texts = [];
  S.pickups = []; S.rings = []; S.effects = [];
  S.boss = null; S.horde = null; S.banner = null; S.shake = 0; S.hitFlash = 0;
  S.taken = []; S.uid = 1; S.offers = null; S.bossDone = false;
  S.kills = 0; S.bestCombo = 0; S.rulesOn = false; S.stillT = 0;
  S.player = makePlayer();
  mouse.x = W / 2; mouse.y = H / 2 - 120;
  hideUI();
  startStage();
}

let last = performance.now();
function loop(now) {
  let dt = (now - last) / 1000;
  last = now;
  if (dt > 0.05) dt = 0.05;
  if (dt < 0) dt = 0;
  if (S.mode === 'play') update(dt);
  draw();
  requestAnimationFrame(loop);
}

window.addEventListener('DOMContentLoaded', function () {
  resize();
  showMenu();
  requestAnimationFrame(loop);
});

window.startGame = startGame;
window.__dbg = { S: S, startStage: startStage, spawnBoss: spawnBoss };
window.takeCard = takeCard;
window.resumeGame = resumeGame;
</script>
</body>
</html>
